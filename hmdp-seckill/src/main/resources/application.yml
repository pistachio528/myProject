server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hmdp_seckill?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 64
        max-idle: 32
        min-idle: 8

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: simple         # simple 模式支持 waitForConfirms 同步等待
    publisher-returns: true              # 消息无法路由到队列时退回给生产者
    template:
      mandatory: true                    # 配合 publisher-returns 使用
    listener:
      simple:
        acknowledge-mode: manual   # 手动 ACK，保证消息可靠消费
        prefetch: 1

  scheduling:
    enabled: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
